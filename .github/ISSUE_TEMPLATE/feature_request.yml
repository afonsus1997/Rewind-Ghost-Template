name: Feature request
description: An idea for the theme or the site
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve for readers or authors?
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Which pages are affected? A sketch or screenshot helps.
